polling_rate: 500
dpi:
  levels: [400, 800, 1600, 3200, 6400]
  active: 3
lighting: {mode: steady, color: "#ff8000", brightness: 128}
macros:
  hello: [down shift, down h, up h, up shift, down e, up e, down l, up l, down l, up l, down o, up o, down space, up space]
  clicker: [down left, wait 40, up left, wait 300]
buttons:
  1: {key: a}
  2: {key: shift+b}
  3: back
  4: forward
  5: {media: volume-up}
  6: {media: mute}
  7: {macro: hello, repeat: 1}
  8: {macro: hello, repeat: 3}
  9: {macro: hello, repeat: until-key}
  10: {macro: clicker, repeat: while-held}
  11: dpi-loop
  12: rgb-toggle
  left: left
  right: right
  middle: middle
  fire: {key: f13}
